apiVersion: apps/v1
kind: Deployment
metadata:
  name: sangokueue
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sangokueue
  template:
    metadata:
      labels:
        app: sangokueue
    spec:
      containers:
        - name: sangokueue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /home/a-propos/
              port: 8000
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: sangokueue-config
          env:
            - name: ENVIRONMENT
              value: production
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: sangokueue-config
                  key: REDIS_URL
            - name: ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | quote }}
            - name: CSRF_TRUSTED_ORIGINS
              value: {{ .Values.csrfTrustedOrigins | quote }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}