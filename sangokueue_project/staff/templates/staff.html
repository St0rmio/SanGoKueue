{% extends 'base.html' %}

{% block title %}Staff{% endblock %}

{% block main %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">Gestion des files</h1>
        <p class="text-muted mb-0">Connecté en tant que {{ user.username }}</p>
    </div>
    <a class="btn btn-outline-secondary" href="{% url 'staff:logout' %}">Se déconnecter</a>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}" role="alert">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% include "staff_board.html" %}

{% endblock %}
