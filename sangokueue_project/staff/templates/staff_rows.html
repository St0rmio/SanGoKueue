<div class="table-responsive">
    <table class="table align-middle mb-0">
        <thead>
            <tr>
                <th>Position</th>
                <th>Visiteur</th>
                <th>Billet</th>
                <th>Priorité</th>
                <th>Statut</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    <td>{% if row.position %}{{ row.position }}{% else %}—{% endif %}</td>
                    <td>{{ row.name }}</td>
                    <td><code>{{ row.visitor_id }}</code></td>
                    <td>{{ row.priority }}</td>
                    <td>
                        {{ row.status }}
                        <div class="small text-muted">{{ row.detail }}</div>
                    </td>
                    <td class="text-end">
                        <form method="post" action="{% url 'staff:remove' %}"
                              onsubmit="return confirm('Retirer {{ row.name }} de la file ?');">
                            {% csrf_token %}
                            <input type="hidden" name="queue" value="{{ queue.name }}">
                            <input type="hidden" name="visitor_id" value="{{ row.visitor_id }}">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Retirer</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
