services:
  web:
    build: .
    image: sangokueue_web:${SANGOKUEUE_TAG:-dev}
    container_name: sangokueue_web
    command: >
      bash -c "python manage.py migrate &&
               python manage.py peupler_billets &&
               python manage.py collectstatic --noinput &&
               daphne -b 0.0.0.0 -p 8000 sangokueue_app.asgi:application"

    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: sangokueue_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    container_name: sangokueue_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  proxy:
    image: nginx:1.30.6
    container_name: sangokueue_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      web:
        condition: service_healthy

  locust:
    image: locustio/locust:2.47.0
    container_name: sangokueue_locust
    ports:
      - "8089:8089"
    volumes:
      - ./load:/mnt/locust/load
      - ./home/donnees_billets.py:/mnt/locust/home/donnees_billets.py:ro
    command: -f /mnt/locust/load/locustfile.py --host http://web:8000
    environment:
      STAFF_USERNAME: admin
      STAFF_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      web:
        condition: service_healthy

# Volume persistant pour la base de données
volumes:
  postgres_data:
