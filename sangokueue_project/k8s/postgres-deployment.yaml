apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: n-grp3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: sangokueue_db
        - name: POSTGRES_USER
          value: sango_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sangokueue-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
