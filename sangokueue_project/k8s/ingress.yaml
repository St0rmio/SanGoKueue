apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sangokueue
  namespace: n-grp3
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: django.grp3.csc8567.luxbulb.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sangokueue
            port:
              number: 8000
