        .bandeau {
            background: rgba(241, 152, 32, .94);
            padding: 1rem;
            text-align: center;
            font-family: 'Bangers', Impact, cursive;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #ed0805;
            text-shadow: 2px 2px 0 #FFD700, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
        }
        .erreur { width: 100%; max-width: 520px; margin: 0 auto; text-align: center; }
        .erreur-carte {
            position: relative; overflow: hidden; padding: 1.5rem 1.25rem 2rem;
            background: rgba(255, 253, 246, .92);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            border: 4px solid #f19820; border-radius: 28px;
            box-shadow: 0 8px 0 #c97400, 0 14px 30px rgba(0, 0, 0, .35);
        }
        .erreur-code {
            position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center;
            gap: .4rem; margin-bottom: .5rem; font-family: 'Bangers', Impact, cursive;
            font-size: clamp(4.5rem, 20vw, 7.5rem); line-height: 1; letter-spacing: 3px; color: #ed0805;
            text-shadow: 3px 3px 0 #FFD700, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }
        .erreur-code::before {
            content: ""; position: absolute; inset: -90% -40%; z-index: -1;
            background: repeating-conic-gradient(from 0deg, rgba(255, 200, 0, .30) 0 8deg, transparent 8deg 20deg);
            -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%);
            mask-image: radial-gradient(circle, #000 0, transparent 62%);
            animation: rotation 40s linear infinite;
        }
        .boule {
            --taille: clamp(4.2rem, 18vw, 6.5rem); position: relative; display: grid; place-items: center;
            width: var(--taille); height: var(--taille); border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #fffbd0 0, #ffd24a 18%, #ffa012 45%, #e46a00 75%, #a84300 100%);
            box-shadow: inset -6px -8px 14px rgba(120, 40, 0, .45), 0 0 22px rgba(255, 170, 0, .65), 0 6px 14px rgba(0, 0, 0, .25);
            animation: flotte 3s ease-in-out infinite; flex-shrink: 0;
        }
        .boule::after {
            content: ""; position: absolute; top: 11%; left: 20%; width: 26%; height: 15%;
            border-radius: 50%; background: rgba(255, 255, 255, .6); transform: rotate(-30deg); filter: blur(2px);
        }
        .boule + .boule { animation-delay: -1.5s; }
        .etoiles { display: grid; grid-template-columns: repeat(var(--cols, 2), auto); gap: .05rem .15rem; font-family: Arial, sans-serif; font-size: calc(var(--taille) * .2); line-height: 1; color: #d10000; }
        .erreur-titre { margin: .5rem 0; font-family: 'Bangers', Impact, cursive; font-size: clamp(1.8rem, 6vw, 2.4rem); letter-spacing: 2px; color: #1a1a1a; text-shadow: 2px 2px 0 #FFD700; }
        .erreur-message { margin: 0 auto 1.25rem; max-width: 380px; color: #403424; }
        .reparation { max-width: 340px; margin: 0 auto 1.5rem; font-family: "Courier New", monospace; font-size: .85rem; letter-spacing: 1px; text-transform: uppercase; color: #126c49; }
