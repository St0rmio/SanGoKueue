{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

    <title>{% block title %}{% endblock %}</title>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="bg-skyblue py-3 shadow-sm">
        <div class="container d-flex justify-content-center align-items-center">
            <img src="{% static 'home/images/logo.png' %}" alt="Logo SanGoKueue" class="me-3" style="height: 50px; width: auto;">
            <h1 class="mb-0 dbz-font">SanGoKueue</h1>
        </div>
    </header>

    <main class="container flex-grow-1 py-4 d-flex flex-column align-items-center justify-content-center">
        {% block main %}{% endblock %}
    </main>

    <footer class="bg-skyblue py-3 mt-auto shadow-sm">
        <div class="container text-center">
            <p class="mb-0 fw-bold text-dark small">
                &copy; Septembre 2026 - SanGoKueue
            </p>
        </div>
    </footer>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
                });

        function planifierRetourAccueil() {
            const bloc = document.querySelector("#visitor-position[data-redirect]");
            if (!bloc) {
                return;
            }
            clearTimeout(window.__retourAccueil);
            const url = bloc.dataset.redirect;
            window.__retourAccueil = setTimeout(function () {
                window.location.assign(url);
            }, 3000);
        }
        document.addEventListener("DOMContentLoaded", planifierRetourAccueil);
        document.body.addEventListener("htmx:afterSwap", planifierRetourAccueil);
    </script>

    {% block extra_js %}{% endblock %}

</body>

</html>
