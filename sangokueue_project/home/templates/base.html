            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .bg-skyblue {
            background: linear-gradient(110deg, rgba(5, 104, 190, .96), rgba(5, 143, 222, .93)) !important;
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        header.bg-skyblue {
            border-bottom: 4px solid #ff8a00;
            position: relative;
        }
        footer.bg-skyblue {
            border-top: 4px solid #ff8a00;
            position: relative;
        }
        /* Ruban orange décoratif, sans masquer le contenu */
        header.bg-skyblue::after, footer.bg-skyblue::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            bottom: -7px;
            background: linear-gradient(90deg, transparent, #ffd166, #ff7900, #ffd166, transparent);
            opacity: .95;
        }
        footer.bg-skyblue::after { top: -7px; bottom: auto; }
        .dbz-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 2px 3px 0 #07356b, -1px -1px 0 #07356b;
        }
        body.home-shenron main { position: relative; z-index: 1; }
        .home-dbz-card {
            width: 100%;
            max-width: 470px;
            padding: clamp(1.25rem, 4vw, 2rem);
            border: 1px solid rgba(255,255,255,.88);
            border-radius: 26px;
            background: rgba(245, 249, 255, .88);
            box-shadow: 0 18px 55px rgba(0, 20, 55, .38), inset 0 0 22px rgba(255,255,255,.68);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .home-dbz-card h2 {
            color: #092d62 !important;
            text-shadow: 0 1px 0 rgba(255,255,255,.8);
        }
        .camera-box {
            border: 3px solid #087ed0;
            border-radius: 20px;
            background: #071d32;
        }
        #qr-reader video { border-radius: 15px; object-fit: cover; }
        #qr-reader__dashboard { color: #fff; }
        .btn-dbz {
            color: #fff !important;
            border: 1px solid #c84b00 !important;
            background: linear-gradient(180deg, #ffb21a 0%, #ff7900 58%, #ed4b00 100%) !important;
            font-weight: 800;
            box-shadow: 0 5px 0 #b83d00, 0 8px 16px rgba(106,42,0,.22);
            transition: transform .15s ease, filter .15s ease;
        }
        .btn-dbz:hover { filter: brightness(1.06); transform: translateY(-1px); }
        .btn-dbz:active { transform: translateY(2px); box-shadow: 0 2px 0 #b83d00; }
        #numero-billet {
            border: 2px solid #c3d9ed;
            border-radius: 999px;
            min-height: 54px;
        }
        #numero-billet:focus {
            border-color: #ff7900;
            box-shadow: 0 0 0 .22rem rgba(255,121,0,.20);
        }
        @media (max-width: 575.98px) {
            body.home-shenron { background-attachment: scroll; }
            header img { height: 42px !important; }
            .home-dbz-card { border-radius: 20px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 bg-light {% block body_class %}{% endblock %}">
    <header class="bg-skyblue py-3 shadow-sm">
        <div class="container d-flex justify-content-center align-items-center">
            <img src="{% static 'home/images/logo.png' %}" alt="Logo SanGoKueue" class="me-3" style="height: 50px; width: auto;">
            <h1 class="mb-0 dbz-font">SanGoKueue</h1>
        </div>
    </header>
    <main class="container flex-grow-1 py-4 d-flex flex-column align-items-center justify-content-center">
        {% block main %}{% endblock %}
    </main>
    <footer class="bg-skyblue py-3 mt-auto shadow-sm">
        <div class="container text-center">
            <p class="mb-0 fw-bold text-white small">&copy; Septembre 2026 - SanGoKueue</p>
        </div>
    </footer>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
        function planifierRetourAccueil() {
            const bloc = document.querySelector("#visitor-position[data-redirect]");
            if (!bloc) return;
            clearTimeout(window.__retourAccueil);
            const url = bloc.dataset.redirect;
            window.__retourAccueil = setTimeout(function () { window.location.assign(url); }, 3000);
        }
        document.addEventListener("DOMContentLoaded", planifierRetourAccueil);
        document.body.addEventListener("htmx:afterSwap", planifierRetourAccueil);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
