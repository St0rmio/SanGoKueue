{% extends 'base.html' %}

{% block title %}SanGoKueue - Accès à la file{% endblock %}

{% block main %}

<div class="billet-container">

    <h2 class="h4 text-center fw-bold mb-3 text-dark">
        Scannez votre billet
    </h2>

    <div class="qr-scanner-container">

        <div id="qr-reader">

            <div id="qr-loading"
                 class="d-flex flex-column align-items-center justify-content-center h-100 w-100">

                <i class="bi bi-camera-video" style="font-size: 3rem;"></i>

                <p class="mt-3 mb-0 fw-bold text-center">
                    Activation de la caméra...
                </p>

            </div>

        </div>

    </div>

    <p id="qr-statut"
       class="small text-center text-muted mb-0"
       role="status">
    </p>

    <div class="d-flex align-items-center my-4 text-muted">

        <hr class="flex-grow-1 border-secondary opacity-50">

        <span class="mx-3 fw-bold small text-uppercase">
            ou
        </span>

        <hr class="flex-grow-1 border-secondary opacity-50">

    </div>

    <h2 class="h4 text-center fw-bold mb-3 text-dark">
        Entrez votre numéro de billet
    </h2>

    <form id="formulaire-billet"
          action="/visiteur/"
          method="get">

        <div class="mb-3">

            <input
                type="text"
                id="numero-billet"
                name="billet"
                class="form-control form-control-lg text-center shadow-sm"
                placeholder="Ex: Billet-12345"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-dbz btn-lg w-100 shadow-sm rounded-pill">

            Entrer dans la file

        </button>

    </form>

</div>

{% endblock %}


{% block extra_js %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const statut = document.getElementById("qr-statut");
    const champBillet = document.getElementById("numero-billet");
    const formulaire = document.getElementById("formulaire-billet");


    // =========================
    // MESSAGE DE STATUT
    // =========================

    function afficher(message, erreur) {

        statut.textContent = message;

        statut.classList.toggle(
            "text-danger",
            !!erreur
        );

        statut.classList.toggle(
            "text-muted",
            !erreur
        );
    }


    // =========================
    // VERIFICATIONS
    // =========================

    if (typeof Html5Qrcode === "undefined") {

        afficher(
            "Le scanner n'a pas pu être chargé (bibliothèque html5-qrcode introuvable). Vérifiez la connexion internet.",
            true
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        afficher(
            "Caméra indisponible : ouvrez le site en http://127.0.0.1:8000 ou en HTTPS.",
            true
        );

        return;
    }


    // =========================
    // INITIALISATION DU SCANNER
    // =========================

    const html5QrCode = new Html5Qrcode(
        "qr-reader",
        {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.QR_CODE
            ],

            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        }
    );


    let dejaLu = false;


    // =========================
    // EXTRACTION DU NUMERO
    // =========================

    function extraireNumero(texte) {

        try {

            const donnees = JSON.parse(texte);

            if (donnees && donnees.id) {

                return String(donnees.id).trim();

            }

        } catch (e) {

            // Le contenu n'est pas du JSON

        }

        return texte.trim();
    }


    // =========================
    // QR CODE DETECTE
    // =========================

    const onScanSuccess = (decodedText) => {

        if (dejaLu) {
            return;
        }

        dejaLu = true;

        const numero = extraireNumero(decodedText);

        afficher(
            "QR code lu (" + numero + "), ouverture de la page…",
            false
        );


        html5QrCode
            .stop()

            .catch((err) => {

                console.error(
                    "Erreur lors de l'arrêt de la caméra.",
                    err
                );

            })

            .then(() => {

                champBillet.value = numero;

                formulaire.requestSubmit();

            });
    };


    // =========================
    // CONFIGURATION DU SCANNER
    // =========================

    const config = {

        fps: 15,

        qrbox: (largeur, hauteur) => {

            const cote = Math.floor(
                Math.min(largeur, hauteur) * 0.90
            );

            return {
                width: cote,
                height: cote
            };
        },

        aspectRatio: 1.0
    };


    // =========================
    // DEMARRAGE DE LA CAMERA
    // =========================

    html5QrCode

        .start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        )

        .then(() => {

            afficher(
                "Caméra active : présentez le QR code devant l'objectif.",
                false
            );

        })

        .catch((err) => {

            const loadingDiv =
                document.getElementById("qr-loading");


            if (loadingDiv) {

                loadingDiv.innerHTML = `

                    <i
                        class="bi bi-camera-video-off text-danger"
                        style="font-size: 3rem;">
                    </i>

                    <p class="mt-3 mb-0 fw-bold text-danger text-center">

                        Caméra inaccessible

                        <br>

                        <small>
                            Vérifiez les permissions de votre navigateur
                        </small>

                    </p>

                `;
            }


            afficher(
                "Impossible de démarrer la caméra : " + err,
                true
            );


            console.error(
                "Erreur de démarrage de la caméra :",
                err
            );

        });

});
</script>

{% endblock %}
