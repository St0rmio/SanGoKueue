{% extends 'base.html' %}
{% block title %}SanGoKueue - Accès à la file{% endblock %}
{% block body_class %}home-shenron{% endblock %}

{% block main %}
<div class="home-dbz-card">
    <div class="w-100 mx-auto" style="max-width: 450px;">
        <h2 class="h4 text-center fw-bold mb-3">Scannez votre billet</h2>
        <div id="qr-reader" class="ratio ratio-1x1 camera-box mb-2 shadow-sm overflow-hidden">
            <div id="qr-loading" class="d-flex flex-column align-items-center justify-content-center h-100 w-100 text-white">
                <i class="bi bi-camera-video" style="font-size: 3rem;"></i>
                <p class="mt-3 mb-0 fw-bold text-center">Activation de la caméra...</p>
            </div>
        </div>
        <p id="qr-statut" class="small text-center text-muted mb-0" role="status"></p>
        <div class="d-flex align-items-center my-4 text-muted">
            <hr class="flex-grow-1 border-secondary opacity-50">
            <span class="mx-3 fw-bold small text-uppercase">ou</span>
            <hr class="flex-grow-1 border-secondary opacity-50">
        </div>
        <h2 class="h4 text-center fw-bold mb-3">Entrez votre numéro de billet</h2>
        <form id="formulaire-billet" action="/visiteur/" method="get" class="px-2">
            <div class="mb-4">
                <input type="text" id="numero-billet" name="billet" class="form-control form-control-lg text-center shadow-sm" placeholder="Ex: Billet-12345" autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-dbz btn-lg w-100 shadow-sm rounded-pill">
                <i class="bi bi-ticket-perforated me-2"></i>Entrer dans la file
            </button>
        </form>
    </div>
</div>
{% endblock %}


{% block extra_js %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const statut = document.getElementById("qr-statut");
    const champBillet = document.getElementById("numero-billet");
    const formulaire = document.getElementById("formulaire-billet");

    function afficher(message, erreur) {

        statut.textContent = message;

        statut.classList.toggle(
            "text-danger",
            !!erreur
        );

        statut.classList.toggle(
            "text-muted",
            !erreur
        );
    }

    if (typeof Html5Qrcode === "undefined") {

        afficher(
            "Le scanner n'a pas pu être chargé (bibliothèque html5-qrcode introuvable). Vérifiez la connexion internet.",
            true
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        afficher(
            "Caméra indisponible : ouvrez le site en http://127.0.0.1:8000 ou en HTTPS.",
            true
        );

        return;
    }

    const html5QrCode = new Html5Qrcode("qr-reader", {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    let dejaLu = false;

    function extraireNumero(texte) {

        try {

            const donnees = JSON.parse(texte);
            if (donnees && donnees.id) return String(donnees.id).trim();
        } catch (e) {}
        return texte.trim();
    }

    const onScanSuccess = (decodedText) => {

        if (dejaLu) {
            return;
        }

        dejaLu = true;

        const numero = extraireNumero(decodedText);

        afficher(
            "QR code lu (" + numero + "), ouverture de la page…",
            false
        );


        html5QrCode
            .stop()

            .catch((err) => {

                console.error(
                    "Erreur lors de l'arrêt de la caméra"
                );

            })

            .then(() => {

                champBillet.value = numero;

                formulaire.requestSubmit();

            });
    };


    // =========================
    // CONFIGURATION DU SCANNER
    // =========================

    const config = {

        fps: 15,
        qrbox: (largeur, hauteur) => {
            const cote = Math.floor(Math.min(largeur, hauteur) * 0.85);
            return { width: cote, height: cote };
        },

        aspectRatio: 1.0
    };


    // =========================
    // DEMARRAGE DE LA CAMERA
    // =========================

    html5QrCode

        .start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        )

        .then(() => {

            afficher(
                "Caméra active : présentez le QR code devant l'objectif.",
                false
            );

        })

        .catch((err) => {

            const loadingDiv =
                document.getElementById("qr-loading");


            if (loadingDiv) {

                loadingDiv.innerHTML = `

                    <i
                        class="bi bi-camera-video-off text-danger"
                        style="font-size: 3rem;">
                    </i>

                    <p class="mt-3 mb-0 fw-bold text-danger text-center">

                        Caméra inaccessible

                        <br>

                        <small>
                            Vérifiez les permissions de votre navigateur
                        </small>

                    </p>

                `;
            }


            afficher(
                "Impossible de démarrer la caméra",
                true
            );


            console.error(
                "Erreur de démarrage de la caméra"
            );

        });

});
</script>
{% endblock %}
